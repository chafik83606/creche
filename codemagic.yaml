workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "fr.creche.app"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Prebuild iOS
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd mobile/ios && pod install
      - name: Set up keychain and certificates
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          # Requires CERTIFICATE_PRIVATE_KEY in appstore_credentials
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Use provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd mobile/ios
          # Discover workspace/scheme generated by Expo prebuild
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          echo "Using workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Using scheme: $SCHEME"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-aab:
    name: Android AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Prebuild Android
        script: |
          cd mobile
          npx expo prebuild --platform android --clean
      - name: Build AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab

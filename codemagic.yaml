workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      # Expo SDK 57 / expo-modules-jsi exige Xcode 26.4+ (Swift 6.3, weak let)
      xcode: 26.4
      node: 20
      cocoapods: default
      vars:
        BUNDLE_ID: "fr.creche.app"
        EXPO_PUBLIC_FIREBASE_API_KEY: "AIzaSyAyq3yLK3aeVddBrsDcrVd7ls8uGWYcjyA"
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: "creche-soinzen.firebaseapp.com"
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: "creche-soinzen"
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: "creche-soinzen.firebasestorage.app"
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "213510187132"
        EXPO_PUBLIC_FIREBASE_APP_ID: "1:213510187132:web:b1bee61e1f1e76ea3ac1f9"
        EXPO_PUBLIC_USE_EMULATORS: "false"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Write mobile .env
        script: |
          cd mobile
          printf '%s\n' \
            "EXPO_PUBLIC_FIREBASE_API_KEY=$EXPO_PUBLIC_FIREBASE_API_KEY" \
            "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            "EXPO_PUBLIC_FIREBASE_PROJECT_ID=$EXPO_PUBLIC_FIREBASE_PROJECT_ID" \
            "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=$EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET" \
            "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
            "EXPO_PUBLIC_FIREBASE_APP_ID=$EXPO_PUBLIC_FIREBASE_APP_ID" \
            "EXPO_PUBLIC_USE_EMULATORS=$EXPO_PUBLIC_USE_EMULATORS" \
            > .env
      - name: Set native build numbers
        script: |
          # CFBundleVersion / versionCode doivent augmenter à chaque upload store.
          cd mobile
          node <<'NODE'
          const fs = require('fs');
          const build = String(process.env.BUILD_NUMBER || '11');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.ios = app.expo.ios || {};
          app.expo.android = app.expo.android || {};
          app.expo.ios.buildNumber = build;
          app.expo.android.versionCode = parseInt(build, 10);
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('iOS buildNumber:', build, '| Android versionCode:', build);
          NODE
      - name: Prebuild iOS
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean
      - name: Link monorepo node_modules for Xcode bundle script
        script: |
          # Le script "Bundle React Native code and images" cherche
          # mobile/node_modules/..., alors que npm workspaces hisse tout à la racine.
          cd mobile
          STASH=$(mktemp -d)
          if [ -d node_modules ] && [ ! -L node_modules ]; then
            (
              cd node_modules
              find . -mindepth 1 -maxdepth 2 -type d | while read -r pkg; do
                pkg=${pkg#./}
                if [ ! -e "../../node_modules/$pkg" ]; then
                  mkdir -p "$STASH/$(dirname "$pkg")"
                  cp -R "$pkg" "$STASH/$pkg"
                fi
              done
            )
          fi
          rm -rf node_modules
          ln -sfn ../node_modules node_modules
          if [ "$(ls -A "$STASH" 2>/dev/null)" ]; then
            cp -R "$STASH/." node_modules/
          fi
          rm -rf "$STASH"
          test -e node_modules/expo
          test -e node_modules/react-native
          ls -la node_modules/expo | head -n 1
      - name: Install CocoaPods
        script: |
          cd mobile/ios && pod install
      - name: Configure Xcode Node / monorepo project root
        script: |
          # Avec mobile/node_modules -> ../node_modules, le script RN calcule
          # PROJECT_ROOT = monorepo root (pas mobile/). Sans ce fix, ENTRY_FILE
          # (index.ts) est cherché à la racine et le bundle échoue (exit 65).
          cd mobile/ios
          {
            echo "export NODE_BINARY=$(which node)"
            echo 'export PROJECT_ROOT="${SRCROOT}/.."'
            echo 'export ENTRY_FILE=index.ts'
          } > .xcode.env.local
          cat .xcode.env.local
      - name: Verify JS bundle (surface Metro errors)
        script: |
          set -e
          cd mobile
          mkdir -p /tmp/creche-bundle
          npx expo export:embed \
            --platform ios \
            --entry-file index.ts \
            --bundle-output /tmp/creche-bundle/main.jsbundle \
            --assets-dest /tmp/creche-bundle \
            --dev false \
            --minify true
          ls -la /tmp/creche-bundle/main.jsbundle
      - name: Set up keychain and certificates
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Use provisioning profiles
        script: |
          set -e
          # Ne pas passer method via --custom-export-options : le CLI Codemagic
          # plante (exit 9) avec app-store-connect. On patche le plist après.
          xcode-project use-profiles --verbose
          echo "=== export_options.plist (avant patch) ==="
          plutil -p "$HOME/export_options.plist" || true
          python3 <<'PY'
          import os, plistlib
          path = os.path.expanduser("~/export_options.plist")
          with open(path, "rb") as f:
              data = plistlib.load(f)
          print("method avant:", data.get("method"))
          # Xcode 26+ : app-store-connect
          data["method"] = "app-store-connect"
          data["destination"] = "export"
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          print("method apres:", data.get("method"))
          PY
          echo "=== export_options.plist (apres patch) ==="
          plutil -p "$HOME/export_options.plist"
      - name: Build IPA
        script: |
          set -euo pipefail
          cd mobile/ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          xcodebuild -list -workspace "$WORKSPACE" -json > /tmp/xcode_schemes.json
          SCHEME=$(python3 -c "import json; s=json.load(open('/tmp/xcode_schemes.json'))['workspace']['schemes']; p=[x for x in s if x=='Zibou'] or [x for x in s if not x.startswith('EX')]; print((p or s)[0])")
          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"
          plutil -p "$HOME/export_options.plist" || true

          set +e
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          BUILD_STATUS=$?
          set -e

          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo "IPA build succeeded"
            exit 0
          fi

          echo "Export failed with app-store-connect — retry with app-store"
          python3 -c "import os,plistlib; p=os.path.expanduser('~/export_options.plist'); d=plistlib.load(open(p,'rb')); d['method']='app-store'; d.pop('destination',None); plistlib.dump(d, open(p,'wb')); print(d.get('method'))"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"

    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-aab:
    name: Android AAB
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      groups:
        - google_play_credentials
        - creche_android
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "fr.creche.app"
        EXPO_PUBLIC_FIREBASE_API_KEY: "AIzaSyAyq3yLK3aeVddBrsDcrVd7ls8uGWYcjyA"
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: "creche-soinzen.firebaseapp.com"
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: "creche-soinzen"
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: "creche-soinzen.firebasestorage.app"
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "213510187132"
        EXPO_PUBLIC_FIREBASE_APP_ID: "1:213510187132:web:b1bee61e1f1e76ea3ac1f9"
        EXPO_PUBLIC_USE_EMULATORS: "false"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Write mobile .env
        script: |
          cd mobile
          printf '%s\n' \
            "EXPO_PUBLIC_FIREBASE_API_KEY=$EXPO_PUBLIC_FIREBASE_API_KEY" \
            "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            "EXPO_PUBLIC_FIREBASE_PROJECT_ID=$EXPO_PUBLIC_FIREBASE_PROJECT_ID" \
            "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=$EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET" \
            "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
            "EXPO_PUBLIC_FIREBASE_APP_ID=$EXPO_PUBLIC_FIREBASE_APP_ID" \
            "EXPO_PUBLIC_USE_EMULATORS=$EXPO_PUBLIC_USE_EMULATORS" \
            > .env
      - name: Set native build numbers
        script: |
          cd mobile
          node <<'NODE'
          const fs = require('fs');
          const build = String(process.env.BUILD_NUMBER || '11');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.ios = app.expo.ios || {};
          app.expo.android = app.expo.android || {};
          app.expo.ios.buildNumber = build;
          app.expo.android.versionCode = parseInt(build, 10);
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('iOS buildNumber:', build, '| Android versionCode:', build);
          NODE
      - name: Decode Android keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
          ls -la "$CM_KEYSTORE_PATH"
      - name: Prebuild Android
        script: |
          cd mobile
          npx expo prebuild --platform android --clean
      - name: Link monorepo node_modules
        script: |
          cd mobile
          STASH=$(mktemp -d)
          if [ -d node_modules ] && [ ! -L node_modules ]; then
            (
              cd node_modules
              find . -mindepth 1 -maxdepth 2 -type d | while read -r pkg; do
                pkg=${pkg#./}
                if [ ! -e "../../node_modules/$pkg" ]; then
                  mkdir -p "$STASH/$(dirname "$pkg")"
                  cp -R "$pkg" "$STASH/$pkg"
                fi
              done
            )
          fi
          rm -rf node_modules
          ln -sfn ../node_modules node_modules
          if [ "$(ls -A "$STASH" 2>/dev/null)" ]; then
            cp -R "$STASH/." node_modules/
          fi
          rm -rf "$STASH"
          test -e node_modules/expo
          test -e node_modules/react-native
          test -e node_modules/@react-native-async-storage/async-storage
      - name: Build AAB
        script: |
          set -e
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

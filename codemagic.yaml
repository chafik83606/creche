workflows:
  ios-ipa:
    name: iOS IPA (sans TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - creche_credentials
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "Creche.xcworkspace"
        XCODE_SCHEME: "Creche"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Prebuild iOS
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd mobile/ios && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd mobile/ios
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Doit correspondre EXACTEMENT au nom de l'intégration
      # créée dans Codemagic → Teams → Integrations → App Store Connect
      app_store_connect: App Store Connect
    environment:
      groups:
        - creche_credentials
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "Creche.xcworkspace"
        XCODE_SCHEME: "Creche"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Prebuild iOS
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd mobile/ios && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd mobile/ios
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-aab:
    name: Android AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - creche_credentials
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Prebuild Android
        script: |
          cd mobile
          npx expo prebuild --platform android --clean
      - name: Build AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
